name: Update Cooperforte Rates
on:
  schedule:
    - cron: '0 12 * * 1-5'     # Weekdays 12h UTC (9h BRT)
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Scrape Cooperforte rates
        run: python scripts/scrape-cooperforte.py
        continue-on-error: true

      - name: Fetch Focus projections
        run: python scripts/fetch-focus.py
        continue-on-error: true

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/
          git diff --cached --quiet || git commit -m "chore: update rates $(date -u +%Y-%m-%d)"
          git push
